version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot_password}
      POSTGRES_DB: ${POSTGRES_DB:-stockpilot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockpilot} -d ${POSTGRES_DB:-stockpilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stockpilot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockpilot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-stockpilot_db}
      - POSTGRES_USER=${POSTGRES_USER:-stockpilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-stockpilot_password}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-stockpilot}:${POSTGRES_PASSWORD:-stockpilot_password}@postgres:5432/${POSTGRES_DB:-stockpilot_db}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-llama-3.3-70b-versatile}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stockpilot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    container_name: stockpilot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - stockpilot-network

volumes:
  postgres_data:
    driver: local

networks:
  stockpilot-network:
    driver: bridge
